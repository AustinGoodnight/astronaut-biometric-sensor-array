; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
    platformio.local.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    sparkfun/SparkFun SCD30 Arduino Library


; upload_port / monitor_port are intentionally omitted here — they're
; machine-specific. PlatformIO auto-detects the port when only one board
; is plugged in; when both are plugged in at once, set them per-machine in
; a gitignored platformio.local.ini (see platformio.local.ini.example and
; CLAUDE.md).
[env:seeed_xiao_esp32c6]
;