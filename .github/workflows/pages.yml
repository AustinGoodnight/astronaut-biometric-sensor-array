name: Deploy web apps (overview, HR dashboard, HR algorithm compare, LoRa range test)

on:
  push:
    branches: [main]
    paths:
      - 'tools/bringup/hr-max30102-ble/ppg_dashboard.html'
      - 'tools/hr-algo-compare/**'
      - 'tools/test-base-station/range-app/**'
      - 'tools/overview/index.html'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # One sub-URL per app; the root is a small index linking to each.
      - name: Stage the apps
        run: |
          mkdir -p site/hr-testing site/hr-compare site/lora-range site/overview
          cp .github/pages/index.html site/index.html
          cp tools/bringup/hr-max30102-ble/ppg_dashboard.html site/hr-testing/index.html
          cp tools/hr-algo-compare/index.html site/hr-compare/index.html
          cp tools/test-base-station/range-app/*.html site/lora-range/
          cp tools/overview/index.html site/overview/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
