name: Deploy web apps (HR dashboard, LoRa range test)

on:
  push:
    branches: [main, test, lora-sx-testing]
    paths:
      - 'firmware/hr-testing/ppg_dashboard.html'
      - 'firmware/lora-sx-testing/range-app/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # One sub-URL per app; the root is a small index linking to each.
      - name: Stage the apps
        run: |
          mkdir -p site/hr-testing site/lora-range
          cp .github/pages/index.html site/index.html
          cp firmware/hr-testing/ppg_dashboard.html site/hr-testing/index.html
          cp firmware/lora-sx-testing/range-app/index.html site/lora-range/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
