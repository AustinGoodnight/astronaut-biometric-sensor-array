<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biometric Sensor Array</title>
<style>
:root {
  color-scheme: light;
  --page: #f3f2ef; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --rule: #dcdad4; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #121212; --surface: #1c1c1b; --ink: #f2f1ee; --ink2: #b5b3ae; --rule: #34332f; --accent: #4a92ea; }
}
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
h1 { font-size: 22px; margin: 0 0 20px; }
a.card { display: block; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin-bottom: 12px; color: inherit; text-decoration: none; }
a.card b { color: var(--accent); font-size: 17px; }
a.card span { display: block; color: var(--ink2); font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Astronaut Biometric Sensor Array</h1>
  <a class="card" href="hr-testing/"><b>HR dashboard</b><span>MAX30102 pulse/PPG monitor over BLE (hr-testing firmware).</span></a>
  <a class="card" href="lora-range/"><b>LoRa range test</b><span>BLE + GPS range logger for the XIAO ESP32C6 / Wio-SX1262 boards. Open in Bluefy on iPhone.</span></a>
</main>
</body>
</html>
