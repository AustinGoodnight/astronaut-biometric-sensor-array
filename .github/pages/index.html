<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biometric Sensor Array</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scoutie+Sans:wght@200..800&display=swap">
<style>
/* Same tokens as firmware/lora-sx-testing/range-app (subset). */
:root {
  color-scheme: light;
  --font-ui: "Scoutie Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --r-lg: 16px;
  --bg: #f3f4f6; --surface: #ffffff; --border: #e2e5ea; --text: #0f1115; --text-2: #4b5260; --accent: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #050506; --surface: #0d0d0e; --border: #242428; --text: #ececee; --text-2: #a6a6ad; --accent: #e5484d; }
}
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
main { max-width: 560px; margin: 0 auto; padding: 40px var(--sp-4); }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 20px; }
.card {
  display: block; padding: var(--sp-4); margin-bottom: var(--sp-3);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  color: inherit; text-decoration: none;
}
.card b { color: var(--accent); font-size: 17px; font-weight: 600; }
.card span { display: block; margin-top: 4px; color: var(--text-2); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Astronaut Biometric Sensor Array</h1>
  <a class="card" href="hr-testing/"><b>HR dashboard</b><span>MAX30102 pulse/PPG monitor over BLE (hr-testing firmware).</span></a>
  <a class="card" href="lora-range/"><b>LoRa range test</b><span>BLE + GPS range logger for the XIAO ESP32C6 / Wio-SX1262 boards. Open in Bluefy on iPhone.</span></a>
</main>
</body>
</html>
