# Common configuration for every build. Debug-only options go in debug.conf,
# battery-run options in release.conf. See ARCHITECTURE.md.

# --- Kernel ---------------------------------------------------------------
# No heap: everything is static (ARCHITECTURE.md §3.1).
CONFIG_HEAP_MEM_POOL_SIZE=0
# main() becomes the supervisor thread after init: lowest app priority.
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_EVENTS=y
# proc uses floats; more than one thread may touch FP registers.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# --- Messaging ------------------------------------------------------------
CONFIG_ZBUS=y

# --- Peripherals ----------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
# A stuck bus must not stall the other bus for long (ARCHITECTURE.md D2).
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=20
CONFIG_ADC=y
CONFIG_INPUT=y

# --- Low power -------------------------------------------------------------
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWEROFF=y
# 32 kHz from the crystal (the XIAO has one). TODO(Raytac board): if the
# module has no crystal, use CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y instead.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# --- Reliability -----------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_CHANNELS=8
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_CRC=y

# --- Persistence (boot count, mode) on internal flash -----------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- BLE peripheral ----------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Wrist"
CONFIG_BT_MAX_CONN=1
# A 32-byte record needs ATT MTU >= 35 (ARCHITECTURE.md D6). The ACL
# buffers between host and controller must be big enough to carry it.
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69
# Preferred connection parameters: 500 ms interval, latency 8, 12 s timeout.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=400
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=400
CONFIG_BT_PERIPHERAL_PREF_LATENCY=8
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=1200
