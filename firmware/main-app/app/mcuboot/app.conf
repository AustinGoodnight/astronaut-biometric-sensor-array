# Application side of the MCUboot variant (ARCHITECTURE.md §10.3).
# Use with -DSB_CONF_FILE=mcuboot/sysbuild.conf
#          -DEXTRA_DTC_OVERLAY_FILE=mcuboot/partitions.overlay

# Image is loaded by MCUboot, not the UF2 bootloader.
CONFIG_BUILD_OUTPUT_UF2=n

# boot_is_img_confirmed() / boot_write_img_confirmed() for swap-with-revert.
CONFIG_FLASH=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

