<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoRa Config UI</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2c313c;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b9dff;
    --ok: #4caf7d;
    --warn: #e0b34a;
    --err: #e0637a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    cursor: pointer;
    background: #262b34;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #0b0d10;
    border-color: var(--accent);
  }
  .boards {
    max-width: 1100px;
  }
  .panel.hidden-panel {
    display: none;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 20px;
  }
  @media (max-width: 760px) {
    .panel { flex-direction: column; }
  }
  .panel-body {
    flex: 1;
    min-width: 0;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--err);
    display: inline-block;
  }
  .dot.on { background: var(--ok); }
  .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  select, button, input {
    background: #11131700;
    background: #262b34;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  select { flex: 1; }
  button {
    cursor: pointer;
    background: var(--accent);
    color: #0b0d10;
    border: none;
    font-weight: 600;
  }
  button.secondary {
    background: #262b34;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .field select, .field input { width: 100%; }
  .current {
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 12px;
    font-family: ui-monospace, monospace;
  }
  .apply-status {
    font-size: 12px;
    min-height: 16px;
    margin: -2px 0 10px;
  }
  .apply-status.muted { color: var(--muted); }
  .apply-status.good { color: var(--ok); }
  .apply-status.bad { color: var(--err); }
  .log {
    background: #0e1013;
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 160px;
    overflow-y: auto;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    padding: 8px;
    color: #a9b3c1;
  }
  .log div { white-space: pre-wrap; word-break: break-all; }
  .stats {
    display: flex;
    flex-direction: column;
    flex: 0 0 300px;
    gap: 16px;
  }
  .stat {
    background: #11131a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .stat-label {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 40px;
    font-weight: 600;
    font-family: ui-monospace, monospace;
    color: var(--text);
  }
  .stat-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  @media (max-width: 760px) {
    .stats { flex-direction: row; flex-basis: auto; }
    .stat-value { font-size: 24px; }
  }
  .stat-value.good { color: var(--ok); }
  .stat-value.warn { color: var(--warn); }
  .stat-value.bad { color: var(--err); }
  .stat-value.muted { color: var(--muted); }
</style>
</head>
<body>
  <h1>LoRa Config UI</h1>
  <p class="sub">Live-tune spreading factor, bandwidth, and TX power over USB serial while the boards keep running. Requires the modified tx/rx firmware to be flashed.</p>

  <div class="tabs" id="tabs"></div>
  <div class="boards" id="boards"></div>

<script>
const BANDWIDTHS = [
  { hz: 7800, label: "7.8 kHz" },
  { hz: 10400, label: "10.4 kHz" },
  { hz: 15600, label: "15.6 kHz" },
  { hz: 20800, label: "20.8 kHz" },
  { hz: 31250, label: "31.25 kHz" },
  { hz: 41700, label: "41.7 kHz" },
  { hz: 62500, label: "62.5 kHz" },
  { hz: 125000, label: "125 kHz (default)" },
  { hz: 250000, label: "250 kHz" },
  { hz: 500000, label: "500 kHz" },
];

const ROLES = [
  { role: "tx", title: "Transmitter (tx)", hasPower: true },
  { role: "rx", title: "Receiver (rx)", hasPower: false },
];

const state = {
  ports: [],
  connected: { tx: false, rx: false },
  path: { tx: null, rx: null },
  cfg: { tx: {}, rx: {} },
  packets: {
    tx: { lastAt: null, lastRSSI: null, lastMalformed: null, malformedCount: 0, total: 0 },
    rx: { lastAt: null, lastRSSI: null, lastMalformed: null, malformedCount: 0, total: 0 },
  },
  pendingApply: { tx: null, rx: null },
  pendingApplyTimer: { tx: null, rx: null },
};

const RX_PACKET_RE = /^Received packet: ([\s\S]*) \| RSSI: (-?\d+)$/;
const TX_SEND_RE = /^Sending packet: (\d+)$/;

// Characters outside printable ASCII (space through ~) indicate line noise /
// a corrupted payload rather than the plain-text protocol this firmware sends.
function findMalformedChars(text) {
  const bad = [];
  for (const ch of text) {
    const code = ch.codePointAt(0);
    if (code < 0x20 || code > 0x7e) bad.push(ch);
  }
  return bad;
}

function formatAge(ms) {
  if (ms == null) return "never";
  if (ms < 1000) return "just now";
  if (ms < 60000) return `${(ms / 1000).toFixed(1)}s ago`;
  const totalSec = Math.floor(ms / 1000);
  return `${Math.floor(totalSec / 60)}m ${totalSec % 60}s ago`;
}

function trackPacket(role, text) {
  const stats = state.packets[role];

  const rxMatch = text.match(RX_PACKET_RE);
  if (rxMatch) {
    const [, payload, rssi] = rxMatch;
    const bad = findMalformedChars(payload);
    stats.lastAt = Date.now();
    stats.lastRSSI = Number(rssi);
    stats.lastMalformed = bad;
    stats.total += 1;
    if (bad.length > 0) stats.malformedCount += 1;
    renderStats(role);
    return;
  }

  const txMatch = text.match(TX_SEND_RE);
  if (txMatch) {
    stats.lastAt = Date.now();
    stats.total += 1;
    renderStats(role);
  }
}

function renderStats(role) {
  const stats = state.packets[role];

  const strengthEl = document.getElementById(`stat-strength-${role}`);
  if (stats.lastRSSI == null) {
    strengthEl.textContent = "—";
    strengthEl.className = "stat-value muted";
  } else {
    strengthEl.textContent = `${stats.lastRSSI} dBm`;
    strengthEl.className =
      "stat-value " + (stats.lastRSSI >= -80 ? "good" : stats.lastRSSI >= -100 ? "warn" : "bad");
  }

  const ageEl = document.getElementById(`stat-age-${role}`);
  const age = stats.lastAt == null ? null : Date.now() - stats.lastAt;
  ageEl.textContent = formatAge(age);
  ageEl.className =
    "stat-value " + (age == null ? "muted" : age < 4000 ? "good" : age < 10000 ? "warn" : "bad");

  const integrityEl = document.getElementById(`stat-integrity-${role}`);
  const integritySubEl = document.getElementById(`stat-integrity-sub-${role}`);
  if (stats.total === 0) {
    integrityEl.textContent = "—";
    integrityEl.className = "stat-value muted";
    integritySubEl.textContent = "";
  } else if (stats.lastMalformed === null) {
    // tx side: nothing received to inspect for corruption
    integrityEl.textContent = "n/a";
    integrityEl.className = "stat-value muted";
    integritySubEl.textContent = `${stats.total} sent`;
  } else if (stats.lastMalformed.length === 0) {
    integrityEl.textContent = "clean";
    integrityEl.className = "stat-value good";
    integritySubEl.textContent = `${stats.malformedCount} bad / ${stats.total} total`;
  } else {
    const codes = stats.lastMalformed.map((c) => "0x" + c.codePointAt(0).toString(16)).join(" ");
    integrityEl.textContent = `${stats.lastMalformed.length} bad byte${stats.lastMalformed.length > 1 ? "s" : ""}`;
    integrityEl.className = "stat-value bad";
    integritySubEl.textContent = `${codes} · ${stats.malformedCount} bad / ${stats.total} total`;
  }
}

function resetStats(role) {
  state.packets[role] = { lastAt: null, lastRSSI: null, lastMalformed: null, malformedCount: 0, total: 0 };
  renderStats(role);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

function buildPanel({ role, title, hasPower }) {
  const panel = el("div", { class: "panel", id: `panel-${role}`, "data-role": role });

  const body = el("div", { class: "panel-body" });
  body.appendChild(el("h2", {}, [
    el("span", { class: "dot", id: `dot-${role}` }),
    el("span", { text: title }),
  ]));

  const portRow = el("div", { class: "row" });
  const portSelect = el("select", { id: `port-${role}` });
  portRow.appendChild(portSelect);
  const connectBtn = el("button", { id: `connect-${role}`, text: "Connect" });
  portRow.appendChild(connectBtn);
  body.appendChild(portRow);

  body.appendChild(el("div", { class: "current", id: `current-${role}`, text: "not connected" }));

  const sfField = el("div", { class: "field" });
  sfField.appendChild(el("label", { text: "Spreading Factor" }));
  const sfSelect = el("select", { id: `sf-${role}` });
  for (let sf = 7; sf <= 12; sf++) {
    sfSelect.appendChild(el("option", { value: sf, text: `SF${sf}` }));
  }
  sfSelect.value = "9";
  sfField.appendChild(sfSelect);
  body.appendChild(sfField);

  const bwField = el("div", { class: "field" });
  bwField.appendChild(el("label", { text: "Bandwidth" }));
  const bwSelect = el("select", { id: `bw-${role}` });
  for (const b of BANDWIDTHS) {
    bwSelect.appendChild(el("option", { value: b.hz, text: b.label }));
  }
  bwSelect.value = "125000";
  bwField.appendChild(bwSelect);
  body.appendChild(bwField);

  if (hasPower) {
    const pwrField = el("div", { class: "field" });
    pwrField.appendChild(el("label", { text: "TX Power (dBm)", id: `pwr-label-${role}` }));
    const pwrInput = el("input", { type: "range", min: "2", max: "20", value: "17", id: `pwr-${role}` });
    pwrField.appendChild(pwrInput);
    body.appendChild(pwrField);
    pwrInput.addEventListener("input", () => {
      document.getElementById(`pwr-label-${role}`).textContent = `TX Power (dBm): ${pwrInput.value}`;
    });
  }

  const btnRow = el("div", { class: "row" });
  const applyBtn = el("button", { id: `apply-${role}`, text: "Apply" });
  const refreshBtn = el("button", { class: "secondary", id: `refresh-${role}`, text: "Refresh" });
  btnRow.appendChild(applyBtn);
  btnRow.appendChild(refreshBtn);
  body.appendChild(btnRow);

  body.appendChild(el("div", { class: "apply-status", id: `apply-status-${role}` }));

  body.appendChild(el("div", { class: "log", id: `log-${role}` }));
  panel.appendChild(body);

  const stats = el("div", { class: "stats", id: `stats-${role}` });
  stats.appendChild(el("div", { class: "stat" }, [
    el("div", { class: "stat-label", text: "Signal Strength" }),
    el("div", { class: "stat-value muted", id: `stat-strength-${role}`, text: "—" }),
  ]));
  stats.appendChild(el("div", { class: "stat" }, [
    el("div", { class: "stat-label", text: "Since Last Packet" }),
    el("div", { class: "stat-value muted", id: `stat-age-${role}`, text: "—" }),
  ]));
  stats.appendChild(el("div", { class: "stat" }, [
    el("div", { class: "stat-label", text: "Packet Integrity" }),
    el("div", { class: "stat-value muted", id: `stat-integrity-${role}`, text: "—" }),
    el("div", { class: "stat-sub", id: `stat-integrity-sub-${role}`, text: "" }),
  ]));
  panel.appendChild(stats);

  return panel;
}

const boardsEl = document.getElementById("boards");
for (const r of ROLES) boardsEl.appendChild(buildPanel(r));

const TAB_MODES = [
  { mode: "tx", label: "TX" },
  { mode: "rx", label: "RX" },
];

function loadViewMode() {
  try {
    const saved = localStorage.getItem("lora-config-ui:view");
    return TAB_MODES.some((t) => t.mode === saved) ? saved : "tx";
  } catch {
    return "tx";
  }
}

function saveViewMode(mode) {
  try {
    localStorage.setItem("lora-config-ui:view", mode);
  } catch {
    // ignore (private browsing / blocked storage)
  }
}

function setViewMode(mode) {
  saveViewMode(mode);
  for (const { role } of ROLES) {
    document.getElementById(`panel-${role}`).classList.toggle("hidden-panel", role !== mode);
  }
  for (const { mode: m } of TAB_MODES) {
    document.getElementById(`tab-${m}`).classList.toggle("active", m === mode);
  }
}

const tabsEl = document.getElementById("tabs");
for (const { mode, label } of TAB_MODES) {
  const btn = el("button", { class: "tab-btn", id: `tab-${mode}`, text: label });
  btn.addEventListener("click", () => setViewMode(mode));
  tabsEl.appendChild(btn);
}
setViewMode(loadViewMode());

async function loadPorts() {
  const res = await fetch("/api/ports");
  const ports = await res.json();
  state.ports = ports;
  for (const { role } of ROLES) {
    const select = document.getElementById(`port-${role}`);
    const prev = select.value;
    select.innerHTML = "";
    if (ports.length === 0) {
      select.appendChild(el("option", { value: "", text: "no ports found" }));
    }
    for (const p of ports) {
      select.appendChild(el("option", { value: p.path, text: `${p.path}${p.manufacturer ? " (" + p.manufacturer + ")" : ""}` }));
    }
    if ([...select.options].some((o) => o.value === prev)) select.value = prev;
  }
}

function logLine(role, text) {
  const log = document.getElementById(`log-${role}`);
  const line = el("div", { text });
  log.appendChild(line);
  while (log.children.length > 200) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function setStatus(role, connected, path, waiting) {
  const wasConnected = state.connected[role];
  state.connected[role] = connected;
  state.path[role] = path || null;
  document.getElementById(`dot-${role}`).classList.toggle("on", connected);
  document.getElementById(`connect-${role}`).textContent = connected ? "Disconnect" : "Connect";
  if (!connected) {
    document.getElementById(`current-${role}`).textContent = "not connected";
    clearTimeout(state.pendingApplyTimer[role]);
    state.pendingApply[role] = null;
    showApplyStatus(role, "", "muted");
  } else if (waiting) {
    document.getElementById(`current-${role}`).textContent = "connected — waiting for board response…";
  }
  if (connected && !wasConnected) resetStats(role);
}

function applyCfgLine(role, text) {
  // e.g. "CFG sf=9 bw=125000 pwr=17"
  if (!text.startsWith("CFG ")) return;
  const cfg = {};
  for (const token of text.substring(4).trim().split(/\s+/)) {
    const [k, v] = token.split("=");
    if (k && v !== undefined) cfg[k] = Number(v);
  }
  state.cfg[role] = cfg;
  const parts = [];
  if (cfg.sf !== undefined) parts.push(`SF${cfg.sf}`);
  if (cfg.bw !== undefined) parts.push(`${cfg.bw} Hz`);
  if (cfg.pwr !== undefined) parts.push(`${cfg.pwr} dBm`);
  document.getElementById(`current-${role}`).textContent = "current: " + parts.join(" / ");

  if (cfg.sf !== undefined) document.getElementById(`sf-${role}`).value = String(cfg.sf);
  if (cfg.bw !== undefined) document.getElementById(`bw-${role}`).value = String(cfg.bw);
  const pwrInput = document.getElementById(`pwr-${role}`);
  if (pwrInput && cfg.pwr !== undefined) {
    pwrInput.value = String(cfg.pwr);
    document.getElementById(`pwr-label-${role}`).textContent = `TX Power (dBm): ${cfg.pwr}`;
  }

  checkPendingApply(role, cfg);
}

function showApplyStatus(role, text, cls) {
  const el = document.getElementById(`apply-status-${role}`);
  el.textContent = text;
  el.className = `apply-status ${cls}`;
}

// Confirms an Apply click against the board's own echoed CFG line, rather
// than assuming the command succeeded just because it was sent.
function checkPendingApply(role, cfg) {
  const pending = state.pendingApply[role];
  if (!pending) return;

  const matches = Object.entries(pending).every(([key, val]) => cfg[key] === val);
  if (!matches) return;

  clearTimeout(state.pendingApplyTimer[role]);
  state.pendingApply[role] = null;
  showApplyStatus(role, "✓ Applied", "good");
  setTimeout(() => {
    if (document.getElementById(`apply-status-${role}`).textContent === "✓ Applied") {
      showApplyStatus(role, "", "muted");
    }
  }, 3000);
}

let ws;
function connectWs() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.addEventListener("message", (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "status") {
      setStatus(msg.role, msg.connected, msg.path, msg.waiting);
    } else if (msg.type === "line") {
      logLine(msg.role, msg.text);
      applyCfgLine(msg.role, msg.text);
      trackPacket(msg.role, msg.text);
    } else if (msg.type === "error") {
      logLine(msg.role, `ERROR: ${msg.message}`);
    }
  });
  ws.addEventListener("close", () => setTimeout(connectWs, 1000));
}
connectWs();

for (const { role, hasPower } of ROLES) {
  document.getElementById(`connect-${role}`).addEventListener("click", () => {
    if (state.connected[role]) {
      ws.send(JSON.stringify({ type: "disconnect", role }));
    } else {
      const path = document.getElementById(`port-${role}`).value;
      if (!path) return;
      ws.send(JSON.stringify({ type: "connect", role, path }));
    }
  });

  document.getElementById(`refresh-${role}`).addEventListener("click", () => {
    ws.send(JSON.stringify({ type: "get", role }));
  });

  document.getElementById(`apply-${role}`).addEventListener("click", () => {
    const sf = Number(document.getElementById(`sf-${role}`).value);
    const bw = Number(document.getElementById(`bw-${role}`).value);
    const msg = { type: "set", role, sf, bw };
    if (hasPower) msg.pwr = Number(document.getElementById(`pwr-${role}`).value);
    ws.send(JSON.stringify(msg));

    const { type, role: _role, ...requested } = msg;
    state.pendingApply[role] = requested;
    clearTimeout(state.pendingApplyTimer[role]);
    showApplyStatus(role, "Applying…", "muted");
    state.pendingApplyTimer[role] = setTimeout(() => {
      state.pendingApply[role] = null;
      showApplyStatus(role, "No confirmation from board — check connection", "bad");
    }, 4000);
  });
}

loadPorts();
setInterval(loadPorts, 5000);
setInterval(() => {
  for (const { role } of ROLES) renderStats(role);
}, 1000);
</script>
</body>
</html>
