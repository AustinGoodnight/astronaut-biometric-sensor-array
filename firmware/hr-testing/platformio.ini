; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
    platformio.local.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; upload_port / monitor_port are intentionally omitted here — they're
; machine-specific. PlatformIO auto-detects the port when only one board
; is plugged in; set them per-machine in a gitignored platformio.local.ini
; (see platformio.local.ini.example and CLAUDE.md) if that's ever ambiguous.

[env:xiao_c6]
build_src_filter = +<*> -<main_spo2.cpp> -<main_filtered.cpp> -<main_ble_test.cpp>

[env:xiao_c6_spo2]
build_src_filter = +<*> -<main.cpp> -<main_filtered.cpp> -<main_ble_test.cpp>

[env:xiao_c6_filtered]
build_src_filter = +<*> -<main.cpp> -<main_spo2.cpp> -<main_ble_test.cpp>
; Standalone NimBLE-Arduino instead of the framework's bundled BLEDevice API - the
; bundled one's advertising silently never went over the air on this board/core combo
; (confirmed via three independent scanners, and via xiao_c6_ble_test below), so this
; is a different implementation of the NimBLE host stack, not just a different wrapper
; around the same one.
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ ^2.5.1

[env:xiao_c6_ble_test]
build_src_filter = +<*> -<main.cpp> -<main_spo2.cpp> -<main_filtered.cpp>
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ ^2.5.1
