[platformio]
extra_configs =
    platformio.local.ini

[env:xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-mbed-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; upload_port / monitor_port are machine-specific. PlatformIO auto-detects
; the port when only one board is plugged in; use platformio.local.ini if needed.
