# Bootloader image (only used when MCUboot is enabled, see mcuboot/sysbuild.conf).
# Keep it minimal: no USB, no console on the XIAO's CDC ACM.
CONFIG_BUILD_OUTPUT_UF2=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_DEVICE_STACK_NEXT=n

