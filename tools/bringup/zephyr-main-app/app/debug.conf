# Debug build: logs + shell on the XIAO's USB CDC ACM port (no RTT: the
# XIAO has no debugger), thread analyzer, asserts, fake sensors.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_APP_LOG_LEVEL_INF=y

CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
# Always show the prompt, whether or not the host signals DTR.
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n

# "kernel thread stacks" in the shell; trim stacks to peak + 25 %.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y

CONFIG_ASSERT=y

# Until the breakout is wired, run the whole pipeline on generators.
CONFIG_APP_FAKE_SENSORS=y
