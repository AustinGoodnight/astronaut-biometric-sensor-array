# Release build: no logging, no console, no shell, no USB.
# (USB comes back when mcumgr SMP over CDC ACM is wired, ARCHITECTURE.md §10.3.
# Updating the XIAO doesn't need it: the UF2 bootloader has its own USB.)

CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_ASSERT=n

# The NCS boot banner selects PRINTK; without it printk can go too.
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n

# USB off entirely (the board's CDC ACM console defaults then have no effect).
CONFIG_SERIAL=n
CONFIG_USB_DEVICE_STACK_NEXT=n
