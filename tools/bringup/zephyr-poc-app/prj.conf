CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_PWM=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
# Deferred, not immediate: immediate logging holds interrupts off while it
# prints, which can trip the Bluetooth controller's timing asserts.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PWM_LOG_LEVEL_DBG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_I2C=y
CONFIG_CPP=y

# Explicitly enable legacy USB stack and disable the next-gen stack
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# Enable serial and console over USB
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MAX30101=y
CONFIG_ADC=y

# Bluetooth sends will run from the sensor work item.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Bluetooth LE peripheral -------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Wrist-POC"
CONFIG_BT_MAX_CONN=1
# Nordic UART Service (NCS): the service the overview dashboard connects to.
CONFIG_BT_NUS=y

# Hardware floating point for the heart-rate filters and autocorrelation.
CONFIG_FPU=y

# Room for the bench-mode raw stream (~1.5 KB/s) if the host is briefly slow.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
