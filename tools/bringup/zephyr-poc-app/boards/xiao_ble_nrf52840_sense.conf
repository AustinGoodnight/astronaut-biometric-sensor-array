# Added on top of prj.conf only for: west build -b xiao_ble/nrf52840/sense
# Put IMU settings here, not in prj.conf: the plain board has no IMU, so
# these options don't exist there and would break its build.
#
# The LSM6DSL driver (CONFIG_LSM6DSL) switches itself on because the Sense
# devicetree has the IMU. Its rate and range are fixed at build time:

# 104 Hz, just above the 100 Hz PPG stream
CONFIG_LSM6DSL_ACCEL_ODR=4
# +/-4 g: enough for wrist motion
CONFIG_LSM6DSL_ACCEL_FS=4
