; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
    platformio.local.ini

[env]
monitor_speed = 115200

; upload_port / monitor_port are intentionally omitted here — they're
; machine-specific. PlatformIO auto-detects the port when only one board
; is plugged in; set them per-machine in a gitignored platformio.local.ini
; (see platformio.local.ini.example) if that's ever ambiguous.

; nRF52820, built with Zephyr. There's no nRF52820 board in PlatformIO, so
; this uses the nRF52833 DK in Zephyr's nRF52820 emulation mode
; (nrf52833dk/nrf52820): the DK's chip is restricted to the 52820's flash,
; RAM, and pins. Pins live in zephyr/boards/nrf52833dk_nrf52820.overlay.
; Flashes through the DK's onboard J-Link; the console is the DK's VCOM port.
[env:nrf52820]
platform = nordicnrf52
board = nrf52833_dk
board_build.zephyr.variant = nrf52833dk/nrf52820
framework = zephyr
upload_protocol = jlink

; ESP32-C6 (Seeed XIAO), built with Arduino like the rest of this repo's
; firmware. Pins are #defined at the top of src/hal_arduino.cpp.
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
build_src_filter = +<*> -<hal_zephyr.cpp>
